# evidence-search instance settings.
#
# The one line that matters: `formats` must include `json`. SearXNG ships with
# the JSON API DISABLED, and without it every request returns HTML and the
# adapter reports a non-json AccessBlocker.
use_default_settings: true

server:
  # searxng-native.sh writes the real key into settings.local.yml (gitignored)
  # and runs from that. This file is a template: a generated secret committed
  # to the repo is shared by every clone, which is no secret at all.
  secret_key: "PLACEHOLDER-generated-into-settings.local.yml"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json          # <- required by evidence-search
  safe_search: 0
  autocomplete: ""
  # Fail fast: a slow engine should surface as unresponsive (which we translate
  # into dirty coverage) rather than stall a worker's dispatch cycle.
  max_ban_time_on_fail: 120
  ban_time_on_fail: 5

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20

# ---------------------------------------------------------------------------
# Engine roster, added 2026-08-30, revised same day after live measurement.
#
# THE PROBLEM: SearXNG's default roster has only FOUR engines that serve general
# web search -- brave, google cse, duckduckgo, startpage. All four are durably
# blocked for this instance (brave/google cse "too many requests"; duckduckgo/
# startpage CAPTCHA). That is a TOTAL general-web outage which reports as a
# healthy-looking "78/82 responsive", because the other 78 engines are
# dictionaries, translators and Wikipedia mirrors.
#
# MEASURED 2026-08-30, one query each, after a clean restart to clear ban state:
#   mwmbl       58 results   OK          <- the workhorse
#   marginalia  68 results   works       <- independent crawler, non-commercial index
#   crowdview    0 results   OK          <- responds, thin index; harmless to keep
#   mojeek       0 results   403         <- blocks this network at the HTTP level,
#                                           confirmed with curl + browser UA. Not
#                                           a SearXNG config issue. DISABLED.
#   qwant        0 results   CAPTCHA     <- DISABLED
#   yep          0 results   access denied <- DISABLED
#
# Keep only what actually returns results. A dead engine is worse than absent:
# it inflates the denominator in coverage reporting and slows every query by the
# request timeout.
engines:
  - name: mwmbl
    disabled: false
  - name: marginalia
    disabled: false
  - name: crowdview
    disabled: false
