# evidence-search instance settings.
#
# The one line that matters: `formats` must include `json`. SearXNG ships with
# the JSON API DISABLED, and without it every request returns HTML and the
# adapter reports a non-json AccessBlocker.
use_default_settings: true

server:
  # searxng-native.sh writes the real key into settings.local.yml (gitignored)
  # and runs from that. This file is a template: a generated secret committed
  # to the repo is shared by every clone, which is no secret at all.
  secret_key: "PLACEHOLDER-generated-into-settings.local.yml"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json          # <- required by evidence-search
  safe_search: 0
  autocomplete: ""
  # Fail fast: a slow engine should surface as unresponsive (which we translate
  # into dirty coverage) rather than stall a worker's dispatch cycle.
  max_ban_time_on_fail: 120
  ban_time_on_fail: 5

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20

# ---------------------------------------------------------------------------
# Engine roster, added 2026-08-30.
#
# WHY: SearXNG's default roster has only FOUR engines that actually serve
# general web search -- brave, google cse, duckduckgo, startpage. On 2026-08-28
# through 08-30 all four were simultaneously refusing us (brave + google cse
# "too many requests"; duckduckgo + startpage CAPTCHA), which is a TOTAL
# general-web outage. It read as a 95%-healthy "78/82 responsive" because the
# other 78 engines are dictionaries, translators and Wikipedia mirrors.
#
# Three research sessions each diagnosed it as a transient rate limit and
# advised "retry". It was not transient: there was no fallback engine left.
#
# These additions are independent crawlers / metasearchers that do not sit
# behind the same CAPTCHA and rate-limit infrastructure as the big four, so a
# simultaneous outage no longer takes general search to zero. Mojeek in
# particular runs its OWN index rather than reselling Bing/Google, which makes
# it a genuinely independent fallback rather than a correlated one.
engines:
  - name: mojeek
    disabled: false
  - name: marginalia
    disabled: false
  - name: mwmbl
    disabled: false
  - name: qwant
    disabled: false
  - name: crowdview
    disabled: false
  - name: yep
    disabled: false
